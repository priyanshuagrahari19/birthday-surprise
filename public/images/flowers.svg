<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" fill="none">
  <!-- Leaves / Foliage -->
  <path d="M60 120 C50 100, 30 95, 25 80 C20 65, 35 60, 45 75 C52 85, 55 105, 60 120 Z" fill="#9eb89d" opacity="0.85" />
  <path d="M60 110 C70 95, 90 90, 95 75 C100 60, 85 55, 75 70 C68 80, 65 98, 60 110 Z" fill="#b0c8af" opacity="0.85" />
  <path d="M60 140 C58 110, 60 80, 60 50" stroke="#7e9c7d" stroke-width="3" stroke-linecap="round" />
  
  <!-- Secondary Bud -->
  <g transform="translate(35, 60) rotate(-20)">
    <ellipse cx="0" cy="0" rx="8" ry="14" fill="#f7b7c5" />
    <ellipse cx="6" cy="2" rx="7" ry="12" fill="#faa5b8" opacity="0.9" />
    <path d="M-4 12 C-2 16, 2 16, 4 12" stroke="#7e9c7d" stroke-width="2" />
  </g>
  
  <!-- Main Flower Petals -->
  <g transform="translate(62, 45)">
    <!-- Back Petals -->
    <circle cx="0" cy="-22" r="16" fill="#fcccd6" />
    <circle cx="21" cy="-7" r="16" fill="#fbb8c6" />
    <circle cx="13" cy="18" r="16" fill="#fca8bc" />
    <circle cx="-13" cy="18" r="16" fill="#fbb8c6" />
    <circle cx="-21" cy="-7" r="16" fill="#fcccd6" />

    <!-- Inner Petals -->
    <circle cx="0" cy="-14" r="13" fill="#ffccd7" />
    <circle cx="14" cy="-4" r="13" fill="#ffb8c7" />
    <circle cx="9" cy="11" r="13" fill="#ffc1ce" />
    <circle cx="-9" cy="11" r="13" fill="#ffb8c7" />
    <circle cx="-14" cy="-4" r="13" fill="#ffccd7" />

    <!-- Flower Center -->
    <circle cx="0" cy="0" r="11" fill="#ffeaa7" />
    <circle cx="0" cy="0" r="8" fill="#fdcb6e" />
    
    <!-- Delicate stamens / dots -->
    <circle cx="-4" cy="-3" r="1.5" fill="#e17055" />
    <circle cx="3" cy="-4" r="1.5" fill="#e17055" />
    <circle cx="4" cy="2" r="1.5" fill="#e17055" />
    <circle cx="-2" cy="4" r="1.5" fill="#e17055" />
  </g>
</svg>
